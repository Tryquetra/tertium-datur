<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tertium Datur: 3D Ternary FPGA Geometry Visualizer</title>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"
      }
    }
  </script>
  <style>
    :root {
      --background: #0b0f17;
      --foreground: #e2e8f0;
      --muted-foreground: #94a3b8;
      --card: rgba(17, 24, 39, 0.72);
      --card-border: rgba(148, 163, 184, 0.18);
      --primary: #f5c542;
      --primary-foreground: #0b0f17;
    }
    * { box-sizing: border-box; }
    html, body {
      width: 100vw;
      height: 100dvh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at 50% 45%, #111827 0%, #070a10 100%);
      color: var(--foreground);
      font-size: 14px;
    }
    .viewport {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      border: none;
      border-radius: 0;
      overflow: hidden;
      content-visibility: auto;
      contain-intrinsic-size: auto none auto 100dvh;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .hud-top,
    .hud-bottom {
      position: fixed;
      left: 16px;
      right: 16px;
      z-index: 10;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      pointer-events: none;
    }
    .hud-top { top: 16px; }
    .hud-bottom { bottom: 16px; }
    .hud-panel {
      pointer-events: auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 10px;
      background: var(--card);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .brand {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--primary);
      padding: 0 6px 0 2px;
      border-right: 1px solid var(--card-border);
    }
    button {
      cursor: pointer;
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 12px;
      font-weight: 500;
      border: 1px solid var(--card-border);
      background: transparent;
      color: var(--muted-foreground);
      transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }
    button:hover {
      color: var(--foreground);
      border-color: rgba(226, 232, 240, 0.35);
    }
    button[aria-pressed="true"] {
      background: var(--primary);
      color: var(--primary-foreground);
      border-color: var(--primary);
    }
    input[type="text"] {
      width: 132px;
      border-radius: 6px;
      padding: 5px 8px;
      font-size: 12px;
      font-family: ui-monospace, monospace;
      border: 1px solid var(--card-border);
      background: rgba(11, 15, 23, 0.7);
      color: var(--foreground);
      outline: none;
      transition: border-color 0.15s ease;
    }
    input[type="text"]:focus {
      border-color: var(--primary);
    }
    input[type="text"].input-error {
      border-color: #ef4444;
    }
    .legend {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      color: var(--muted-foreground);
    }
    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 9999px;
      display: inline-block;
    }
    .note-sep {
      border-left: 1px solid var(--card-border);
      padding-left: 10px;
      color: var(--muted-foreground);
    }
    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      font-size: 12px;
      color: var(--muted-foreground);
    }
    .stats strong {
      color: var(--foreground);
      font-family: ui-monospace, monospace;
    }
  </style>
</head>
<body>
  <div id="viewport-container" class="viewport">
    <canvas id="fpga-canvas" aria-label="Interactive 3D ternary FPGA geometry visualizer"></canvas>
  </div>

  <header class="hud-top">
    <div class="hud-panel" role="group" aria-label="Ternary geometry modes">
      <span class="brand">Tertium Datur</span>
      <button type="button" data-mode="cell">1 Trit Y-Hex</button>
      <button type="button" data-mode="tryte6">Tryte6 Rosette (7)</button>
      <button type="button" data-mode="word21">Word21 Fabric (21)</button>
      <button type="button" data-mode="compare">90° Square vs 120° Hex-Y</button>
    </div>
    <div class="hud-panel">
      <input id="input-decimal" type="text" inputmode="numeric" placeholder="e.g. -364 or 42" aria-label="Decimal integer to plot" />
      <button type="button" id="btn-plot">Plot Decimal</button>
      <button type="button" id="btn-invert">Invert</button>
      <button type="button" id="btn-clock" aria-pressed="false" data-idle-label="Ternary Pulse" data-active-label="Pause Pulse">Ternary Pulse</button>
      <button type="button" id="btn-reset">Reset</button>
    </div>
  </header>

  <footer class="hud-bottom">
    <div class="hud-panel legend">
      <span class="legend-item"><span class="dot" style="background:#38bdf8"></span>-1</span>
      <span class="legend-item"><span class="dot" style="background:#e2e8f0"></span>0</span>
      <span class="legend-item"><span class="dot" style="background:#fb923c"></span>+1</span>
      <span class="legend-item"><span class="dot" style="background:#f5c542"></span>Y Route</span>
      <span id="mode-note" class="note-sep"></span>
    </div>
    <div class="hud-panel stats">
      <span>Value: <strong id="stat-decimal">0</strong></span>
      <span>Trits: <strong id="stat-vector">0</strong></span>
      <span>Energy dV^2: <strong id="stat-energy">0.00 Vdd^2</strong></span>
    </div>
  </footer>

  <script type="module" src="./src/ui.js"></script>
</body>
</html>
